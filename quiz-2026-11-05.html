<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haushalte und Unternehmen – Abschlussquiz</title>
<style>
  :root { --bg:#f4f7f8; --card:#ffffff; --text:#1e1e1e; --muted:#5f6b70; --navy:#12343b;
          --accent:#e2711d; --ok:#1d7a3e; --ok-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe5e3; --line:#d5dee0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1c1f; --card:#18292d; --text:#eef3f4; --muted:#a9b8bc; --navy:#9fc3cb;
            --accent:#f0954f; --ok:#7fd49b; --ok-bg:#183626; --bad:#f2a49d; --bad-bg:#3a1d1b; --line:#2c4247; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  .course { color:var(--muted); font-size:14px; margin:0; }
  h1 { color:var(--navy); font-size:24px; margin:4px 0 6px; }
  .hint { color:var(--muted); font-size:15px; margin:0 0 18px; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .q h2 { font-size:17px; margin:0 0 12px; }
  .q h2 span { color:var(--accent); margin-right:6px; }
  button.opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:transparent;
               border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; }
  button.opt:disabled { cursor:default; }
  button.opt.right { border-color:var(--ok); background:var(--ok-bg); font-weight:600; }
  button.opt.wrong { border-color:var(--bad); background:var(--bad-bg); }
  .explain { margin:6px 0 0; font-size:15px; }
  .explain b.r { color:var(--ok); } .explain b.f { color:var(--bad); }
  #result { background:var(--navy); color:#fff; border-radius:12px; padding:18px; text-align:center; display:none; }
  @media (prefers-color-scheme: dark) { #result { color:#0f1c1f; } }
  #result strong { display:block; font-size:30px; }
  footer { color:var(--muted); font-size:13px; margin-top:22px; }
</style>
</head>
<body>
<main>
  <p class="course">GRW · Klasse 10 · 05.11.2026</p>
  <h1>Haushalte und Unternehmen – Abschlussquiz</h1>
  <p class="hint">Tippe jeweils eine Antwort an. Du siehst sofort, ob sie stimmt. Merk dir die Fragen, bei denen du unsicher warst.</p>
  <div id="quiz"></div>
  <div id="result"><strong id="score"></strong><span id="verdict"></span></div>
  <footer>Dieses Quiz speichert und sendet keine Daten. Zahlen zum Fahrradhandel: dpa, 02.09.2026.</footer>
</main>
<script>
const QUESTIONS = [{"question": "Was beschreibt private Haushalte im Wirtschaftskreislauf am besten?", "options": ["Sie stellen Güter her und verkaufen sie.", "Sie stellen Arbeitskraft zur Verfügung, beziehen Einkommen und konsumieren oder sparen.", "Sie erheben Steuern und zahlen Kindergeld.", "Sie bewahren Geld auf und vergeben Kredite."], "answer": 1, "explanation": "Haushalte arbeiten, beziehen dafür Einkommen und verwenden es für Konsum oder zum Sparen."}, {"question": "Was ist KEIN Einkommen eines Haushalts?", "options": ["Lohn für einen Minijob", "Rente", "Kindergeld", "Ausgaben für ein neues Fahrrad"], "answer": 3, "explanation": "Das Fahrrad ist eine Konsumausgabe: Geld fließt vom Haushalt zum Unternehmen. Lohn, Rente und Kindergeld fließen dem Haushalt zu."}, {"question": "Welche Aufgabe gehört NICHT zu den Unternehmen?", "options": ["Güter herstellen oder Dienstleistungen anbieten", "Arbeitskräfte beschäftigen und Löhne zahlen", "Waren verkaufen und Gewinn erzielen wollen", "Steuern festlegen"], "answer": 3, "explanation": "Steuern legt der Staat fest. Unternehmen produzieren, beschäftigen und verkaufen."}, {"question": "Wie nennt man den Teil des Einkommens, den ein Haushalt nicht für Konsum ausgibt?", "options": ["Umsatz", "Ersparnis", "Gewinn", "Investition"], "answer": 1, "explanation": "Einkommen = Konsum + Ersparnis. Was nicht ausgegeben wird, wird gespart."}, {"question": "Warum ist euer Fahrradladen gleich doppelt auf Haushalte angewiesen?", "options": ["Haushalte sind Kunden und zugleich Arbeitskräfte.", "Haushalte legen die Preise fest.", "Haushalte liefern die Ersatzteile.", "Haushalte vergeben Kredite an den Laden."], "answer": 0, "explanation": "Ohne Kunden kein Umsatz, ohne Beschäftigte keine Werkstatt – beide Rollen übernehmen Haushalte."}, {"question": "Haushalte kaufen weniger Fahrräder. Was folgt daraus zuerst für den Laden?", "options": ["Der Laden erhöht die Löhne.", "Der Umsatz des Ladens sinkt.", "Der Laden stellt mehr Personal ein.", "Der Staat senkt die Steuern."], "answer": 1, "explanation": "Weniger Verkäufe bedeuten weniger Einnahmen. Erst daraus folgen weitere Schritte wie weniger Bestellungen oder weniger Arbeitsstunden."}, {"question": "Wie entwickelte sich 2025 der Umsatz im deutschen Fahrradhandel laut dpa (02.09.2026)?", "options": ["Er stieg um etwa 10 %.", "Er blieb gleich.", "Er sank um etwa 10 %.", "Er halbierte sich."], "answer": 2, "explanation": "Der Umsatz im Handel brach um zehn Prozent ein, die Beschäftigung in der Branche sank um rund drei Prozent."}, {"question": "In einer Krise sparen alle Haushalte gleichzeitig mehr. Was kann passieren?", "options": ["Alle haben am Ende sicher mehr Geld.", "Die Unternehmen verkaufen mehr.", "Umsätze und Einkommen sinken – dann können viele sogar weniger sparen.", "Es passiert nichts, Sparen betrifft nur den eigenen Haushalt."], "answer": 2, "explanation": "Das ist das Sparparadoxon: Was für einen Haushalt vernünftig ist, kann allen zusammen schaden, weil der Konsum der einen das Einkommen der anderen ist."}];
const quiz = document.getElementById('quiz');
let answered = 0, correct = 0;

QUESTIONS.forEach((q, qi) => {
  const box = document.createElement('section');
  box.className = 'q';
  const h = document.createElement('h2');
  h.innerHTML = '<span>' + (qi + 1) + '/' + QUESTIONS.length + '</span>';
  h.appendChild(document.createTextNode(q.question));
  box.appendChild(h);
  const buttons = q.options.map((text, oi) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', () => choose(oi));
    box.appendChild(b);
    return b;
  });
  const explain = document.createElement('p');
  explain.className = 'explain';
  box.appendChild(explain);
  quiz.appendChild(box);

  function choose(oi) {
    buttons.forEach(b => b.disabled = true);
    buttons[q.answer].classList.add('right');
    const isRight = oi === q.answer;
    if (!isRight) buttons[oi].classList.add('wrong');
    explain.innerHTML = isRight ? '<b class="r">Richtig.</b> ' : '<b class="f">Leider falsch.</b> ';
    explain.appendChild(document.createTextNode(q.explanation));
    answered++;
    if (isRight) correct++;
    if (answered === QUESTIONS.length) showResult();
  }
});

function showResult() {
  document.getElementById('score').textContent = correct + ' von ' + QUESTIONS.length + ' richtig';
  document.getElementById('verdict').textContent = correct >= 7 ? 'Stark – du hast die Stunde sicher im Griff.'
    : correct >= 5 ? 'Gut – schau dir die falschen Fragen noch einmal an.'
    : 'Geh die Fragen mit deinem Arbeitsblatt noch einmal durch.';
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
